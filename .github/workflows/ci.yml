# CI-конвейер: при каждом push и pull request GitHub сам
# скачивает код, ставит Java 21 и запускает интеграционные тесты (mvn test).
name: CI - интеграционные тесты

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:   # кнопка «Run workflow» для ручного запуска

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Скачать код
        uses: actions/checkout@v4

      - name: 2. Установить Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven            # кэш зависимостей Maven — второй запуск быстрее

      - name: 3. Запустить интеграционные тесты
        run: mvn -B test

      - name: 4. Сохранить отчёты тестов
        if: always()              # даже если тесты упали
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: 5. Итог в сводку запуска
        if: always()
        run: |
          echo "## Результаты тестов" >> $GITHUB_STEP_SUMMARY
          grep -h "Tests run" target/surefire-reports/*.txt >> $GITHUB_STEP_SUMMARY || echo "отчётов нет" >> $GITHUB_STEP_SUMMARY
